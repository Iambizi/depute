name: CI

on:
  push:
  pull_request:

jobs:
  library:
    name: Test, types, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
      - run: npm run checksums:check
      - run: node --test packages/cli/test/install.test.mjs

  cli-smoke:
    name: CLI install in a fresh Vite app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/cli-smoke.mjs

  docs:
    name: Docs site build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/www
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/www/package-lock.json
      - run: npm ci
      - run: npm run build
