name: CI

on:
  push:
  pull_request:

jobs:
  library:
    name: Test, types, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
      - run: npm run checksums:check
      - run: npm run styles:check
      - run: node --test packages/cli/test/install.test.mjs
      - run: npm run schema:core:check
      - run: npm run types:core:check
      - run: npm run test:core

  react-18:
    name: Tests on React 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --legacy-peer-deps react@18.3.1 react-dom@18.3.1 @types/react@18.3.31 @types/react-dom@18.3.7
      - run: node -e "const v=require('react/package.json').version; const t=require('@types/react/package.json').version; if(!v.startsWith('18.')||!t.startsWith('18.')) { console.error('expected React 18 types, found react '+v+' @types/react '+t); process.exit(1) }"
      - run: npm test
      - run: npm run type-check

  cli-smoke:
    name: CLI install in a fresh Vite app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/cli-smoke.mjs

  docs:
    name: Docs site build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/www
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/www/package-lock.json
      - run: npm ci
      - run: npm run build

  impeccable:
    name: Impeccable detector
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes impeccable@4.7.0 detect src apps/www/src
